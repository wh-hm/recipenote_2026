
{% extends "base.html" %}

{% block title %}新規ユーザー登録 | レシピノート{% endblock %}

{% block content %}

<h1>新規ユーザー登録</h1>

<form method="POST">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">登録</button>
</form>

<p>
    既にアカウントをお持ちの方は
    <a href="{% url 'login' %}">ログイン</a>
</p>

{% endblock %}
